  function finish(error){clearTimeout(timer);element.removeEventListener('loadedmetadata',ready);element.removeEventListener('error',failed);error?reject(error):resolve();}
  function ready(){finish();}function failed(){finish(new Error('media'));}
  element.addEventListener('loadedmetadata',ready,{once:true});element.addEventListener('error',failed,{once:true});
 });
}
function cancelPowerFade(){powerFadeSerial++;clearTimeout(powerFadeTimer);powerFadeTimer=null;}
function fadePower(target,duration,finished){
 cancelPowerFade();const serial=powerFadeSerial,from=powerGain;
 const now=()=>typeof performance!=='undefined'?performance.now():Date.now();const began=now();
 function step(){
  if(serial!==powerFadeSerial)return;
  const progress=Math.min(1,(now()-began)/duration);
  const eased=progress*progress*(3-2*progress);
  powerGain=from+(target-from)*eased;applyAudioLevel();
  if(progress<1)powerFadeTimer=setTimeout(step,16);
  else{powerFadeTimer=null;if(finished)finished();}

}
const sleepButton=document.getElementById('sleep'),volumeControl=document.getElementById('volume');
const dial=document.querySelector('.concentric');
const dialSpan=310;
function ringAngle(fraction){return -155+dialSpan*Math.max(0,Math.min(1,fraction));}
function updateSleep(){
 const remaining=sleepDeadline ? Math.max(0,(sleepDeadline-Date.now())/60000) : sleepMinutes;
 if(sleepDeadline && remaining<=0){sleepMinutes=0;sleepDeadline=0;sleepGain=0;stop('Sleep timer finished. Rest well.');return;}
 if(listening)sleepGain=sleepDeadline ? Math.min(1,remaining*6) : 1;
 else if(audio.paused)sleepGain=1;
 scheduleSleepFade();applyAudioLevel();
 document.getElementById('sleep-readout').textContent=remaining>0 ? 'SLEEP: '+String(Math.ceil(remaining)).padStart(2,'\u00a0')+' min' : '';
 sleepButton.style.setProperty('--angle',ringAngle(remaining/60)+'deg');
 const marker=document.querySelector('.sleep-marker'),angle=ringAngle(remaining/60)*Math.PI/180;
 marker.style.left='calc('+ (50+50*Math.sin(angle)) +'% - '+(4*Math.sin(angle))+'px)';
 marker.style.top='calc('+ (50-50*Math.cos(angle)) +'% + '+(4*Math.cos(angle))+'px)';
 sleepButton.setAttribute('aria-valuenow',String(Math.round(remaining*10)/10));
 sleepButton.setAttribute('aria-valuetext',remaining>0 ? Math.ceil(remaining)+' minutes remaining' : 'Off');
 volumeControl.style.setProperty('--angle',ringAngle(baseVolume)+'deg');
 volumeControl.setAttribute('aria-valuenow',String(Math.round(baseVolume*100)/10));
 volumeControl.setAttribute('aria-valuetext',Math.round(baseVolume*100)+' percent');
}
function startListening(){cancelPowerFade();powerGain=0;powerFadePending=true;ensureAudioClock();resetCrossfade();scheduledSleepDeadline=null;applyAudioLevel();listening=true;document.body.classList.add('powered');setBuffering(true);button.setAttribute('aria-label','Turn radio off');button.setAttribute('aria-pressed','true');if(sleepMinutes&&!sleepDeadline)sleepDeadline=Date.now()+sleepMinutes*60000;updateSleep();join();}
function setRing(control,fraction){
 fraction=Math.max(0,Math.min(1,fraction));
 if(control===sleepButton){sleepMinutes=Math.round(fraction*60);sleepDeadline=sleepMinutes&&listening ? Date.now()+sleepMinutes*60000 : 0;}
 else {baseVolume=Math.round(fraction*20)/20;}
 updateSleep();
}
for(const control of [sleepButton,volumeControl]){
 let dragging=false,lastAngle=null;
 function rotate(e){
  const box=dial.getBoundingClientRect(),dx=e.clientX-box.left-box.width/2,dy=e.clientY-box.top-box.height/2;
  if(Math.hypot(dx,dy)<box.width*.075)return;
  let angle=Math.atan2(dx,-dy)*180/Math.PI;
  // Do not jump from maximum to zero when a drag crosses the bottom gap.
  if(lastAngle!==null&&Math.abs(angle-lastAngle)>180)angle=lastAngle>0 ? 180 : -180;
  lastAngle=angle;
  setRing(control,(Math.max(-155,Math.min(155,angle))+155)/dialSpan);
 }
 for(const hitTarget of (control===sleepButton ? [control,document.querySelector('.sleep-marker')] : [control]))hitTarget.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();e.stopPropagation();control.focus();dragging=true;lastAngle=null;control.setPointerCapture(e.pointerId);rotate(e);});
 control.addEventListener('pointermove',e=>{if(dragging)rotate(e);});
 control.addEventListener('pointerup',()=>{dragging=false;lastAngle=null;});
 control.addEventListener('pointercancel',()=>{dragging=false;lastAngle=null;});
 control.addEventListener('lostpointercapture',()=>{dragging=false;lastAngle=null;});
 control.addEventListener('keydown',e=>{
  const isSleep=control===sleepButton,max=isSleep?60:100;
  let value=isSleep ? (sleepDeadline ? Math.max(0,(sleepDeadline-Date.now())/60000) : sleepMinutes) : baseVolume*100;
  if(e.key==='Home')value=0;else if(e.key==='End')value=max;
  else if(['ArrowRight','ArrowUp'].includes(e.key))value=Math.round(value)+(isSleep?1:5);
  else if(['ArrowLeft','ArrowDown'].includes(e.key))value=Math.round(value)-(isSleep?1:5);
  else if(e.key==='PageUp')value+=isSleep?15:10;else if(e.key==='PageDown')value-=isSleep?15:10;
  else return;
  e.preventDefault();setRing(control,value/max);
 });
}
const marks=document.querySelector('.dial-marks');
for(const [values,radius,max,kind] of [[[0,15,30,45,60],47.5,60,'sleep'],[[0,5,10],32,10,'volume']]){
 for(const value of values){const angle=ringAngle(value/max)*Math.PI/180;const labelRadius=kind==='volume'&&value!==5?31:kind==='sleep'&&(value===0||value===60)?50.5:radius;const label=document.createElement('span');label.className='scale-label '+kind;label.textContent=value;label.style.left=(50+labelRadius*Math.sin(angle))+'%';label.style.top=(50-labelRadius*Math.cos(angle))+'%';marks.appendChild(label);}
}
for(let value=0;value<=10;value++){const tick=document.createElement('span');tick.className='volume-tick';tick.style.setProperty('--tick-angle',ringAngle(value/10)+'deg');marks.appendChild(tick);}
applyAudioLevel();
function display(p){if(titleText.textContent!==p.track.title){titleText.textContent=p.track.title;titleWindow.setAttribute('aria-label',p.track.title);titleWindow.setAttribute('title',p.track.title);}document.getElementById('year').textContent=p.track.year;fitTitle();}
function stop(message=''){
 cancelTuning();
 listening=false;setBuffering(false);document.body.classList.remove('powered');document.body.classList.remove('playing');generation++;loading=false;powerFadePending=false;if(sleepDeadline)sleepMinutes=Math.max(0,(sleepDeadline-Date.now())/60000);sleepDeadline=0;updateSleep();button.setAttribute('aria-label','Turn radio on');button.setAttribute('aria-pressed','false');status.textContent=message;
 if(audio.paused){cancelPowerFade();powerGain=0;pauseDecks();resetCrossfade();applyAudioLevel();}
 else fadePower(0,350,()=>{if(!listening){pauseDecks();resetCrossfade();}});
}
async function join(){
 const token=++generation,p=programme();loading=true;display(p);status.textContent='';if(listening&&(audio.paused||audio.ended||loaded<0))setBuffering(true);
 updateCrossfade();
 const outgoing=decks.find(d=>d.element===audio);
 const switching=loaded>=0&&loaded!==p.index;
 const incoming=switching?decks.find(d=>d!==outgoing):outgoing;
 incoming.owner=token;
 try{
  if(switching){incoming.element.pause();setMix(incoming,0);}
  if(incoming.index!==p.index){incoming.index=p.index;incoming.element.src=p.track.file;incoming.element.load();}
  await waitForMetadata(incoming.element);
  if(token!==generation||!listening)return;
  const current=programme();
  if(current.index!==p.index){loading=false;return join();}
  incoming.element.currentTime=Math.min(current.mediaOffset,Math.max(0,incoming.element.duration-.05));
  await incoming.element.play();
  if(token!==generation||!listening){if(incoming.owner===token)incoming.element.pause();return;}
  const live=programme();
  if(live.index!==p.index){incoming.element.pause();loading=false;return join();}
  if(Math.abs(incoming.element.currentTime-live.mediaOffset)>.5)incoming.element.currentTime=live.mediaOffset;
  audio=incoming.element;loaded=p.index;
  if(switching)beginCrossfade(outgoing,incoming,Math.max(.35,CROSSFADE_SECONDS-live.offset));
  else setMix(incoming,1);
  document.body.classList.add('playing');setBuffering(false);
  if(powerFadePending){powerFadePending=false;fadePower(1,350);}
  status.textContent='';
 }catch(error){if(token===generation){incoming.index=-1;loaded=-1;stop('Could not start the audio. Press Listen to try again.');}}
 finally{if(token===generation)loading=false;}
}
button.addEventListener('click',()=>{if(listening){stop();}else{startListening();}});

function tick(){
 updateCrossfade();updateSleep();const p=programme();display(p);
 if(listening&&!tuning&&!loading){
  if(p.index!==loaded||(!crossfade&&(Math.abs(audio.currentTime-p.mediaOffset)>3||!p.track.segments.some(([a,b])=>audio.currentTime>=a&&audio.currentTime<b&&p.mediaOffset>=a&&p.mediaOffset<b)||audio.ended)))join();
  else prepareNext(p);
 }
}
for(const deck of decks){
 deck.element.addEventListener('timeupdate',()=>{if(deck.element===audio&&listening&&!tuning&&!loading)tick();});
 deck.element.addEventListener('ended',()=>{if(deck.element===audio&&listening&&!tuning&&!loading)tick();});
 deck.element.addEventListener('waiting',()=>{if(deck.element===audio&&listening){status.textContent='';setBuffering(true);}});
 deck.element.addEventListener('playing',()=>{if(deck.element===audio&&listening&&!loading){setBuffering(false);document.body.classList.add('playing');}});
 deck.element.addEventListener('error',()=>{if(deck.element===audio&&listening&&!tuning&&!loading){loaded=-1;stop('Audio unavailable. Press Listen to try again.');}});
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
window.addEventListener('pageshow',tick);
if('mediaSession' in navigator){for(const action of ['seekbackward','seekforward','seekto','previoustrack','nexttrack']){try{navigator.mediaSession.setActionHandler(action,null);}catch{}}try{navigator.mediaSession.setActionHandler('pause',()=>stop());navigator.mediaSession.setActionHandler('play',()=>startListening());}catch{}}
document.addEventListener('pointerdown',()=>document.body.classList.remove('keyboard-controls'),true);
document.addEventListener('keydown',e=>{if(['Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End','PageUp','PageDown'].includes(e.key))document.body.classList.add('keyboard-controls');});
// Match the last grille row to the lower physical end of the sleep arc.
function alignSpeaker(){
 const speaker=document.querySelector('.speaker');
 const housing=document.querySelector('.radio'),screen=document.querySelector('.lcd');
 const factor=housing.offsetWidth ? housing.getBoundingClientRect().width/housing.offsetWidth : 1;
 const rect=element=>{const r=element.getBoundingClientRect();return Object.fromEntries(['left','top','right','bottom','width','height'].map(k=>[k,r[k]/factor]));};
 const caseBox=rect(housing),screenBox=rect(screen),controlBox=rect(dial);
 const centreX=controlBox.left+controlBox.width/2,centreY=controlBox.top+controlBox.height/2;
 housing.style.setProperty('--case-curve-x',Math.max(30,caseBox.right-centreX)+'px');
 housing.style.setProperty('--case-curve-y',Math.max(30,caseBox.bottom-centreY)+'px');
 const sideHeight=screenBox.height;
 // Size the hidden circle so its exposed chord spans the full display height.
 const sideProjection=window.innerWidth<=650?10:12;
 const sideDiameter=sideHeight*sideHeight/(4*sideProjection)+sideProjection;
 housing.style.setProperty('--side-dial-diameter',sideDiameter+'px');
 housing.style.setProperty('--side-dial-height',sideHeight+'px');
 housing.style.setProperty('--side-dial-top',(screenBox.top-caseBox.top+(screenBox.height-sideHeight)/2)+'px');
 housing.style.setProperty('--battery-width',rect(speaker).width+'px');
 if(window.innerWidth<=650){speaker.style.removeProperty('--speaker-height');return;}
 const grilleBox=rect(speaker),dialBox=rect(dial);
 const arcBottom=dialBox.top+dialBox.height*(.5+.43*Math.cos(25*Math.PI/180));
 speaker.style.setProperty('--speaker-height',Math.max(0,arcBottom-grilleBox.top)+'px');
}
if(typeof ResizeObserver!=='undefined'){
 const speakerObserver=new ResizeObserver(()=>requestAnimationFrame(alignSpeaker));
 speakerObserver.observe(document.querySelector('.panel'));
 window.addEventListener('resize',alignSpeaker);
 requestAnimationFrame(alignSpeaker);
}
const tuner=document.getElementById('station-tuner');
let tuning=false,tuneTimer=null;
function updateStation(){
 const station=stations[stationIndex];
 document.getElementById('station-name').textContent=station.name;
 document.getElementById('station-number').textContent=String(stationIndex+1).padStart(2,'0');
 tuner.setAttribute('aria-valuemax',String(stations.length));
 tuner.setAttribute('aria-valuenow',String(stationIndex+1));
 tuner.setAttribute('aria-valuetext',station.name);
 tuner.style.setProperty('--station-angle',(stationIndex*9)+'deg');
}
function cancelTuning(){clearTimeout(tuneTimer);tuneTimer=null;tuning=false;}
function setStation(index){
 index=Math.max(0,Math.min(stations.length-1,index));
 if(index===stationIndex)return;
 cancelTuning();stationIndex=index;
 try{localStorage.setItem('cinema-radio-station',stations[index].id);}catch{}
 generation++;loading=false;loaded=-1;updateStation();display(programme());status.textContent='';
 if(!listening)return;
 cancelPowerFade();powerGain=0;powerFadePending=true;applyAudioLevel();pauseDecks();resetCrossfade();
 document.body.classList.remove('playing');setBuffering(true);tuning=true;
 tuneTimer=setTimeout(()=>{tuneTimer=null;tuning=false;if(listening)join();},260);
}
// The narrow visible rim has a larger transparent pointer/touch target.
let tunerDrag=null,wheelTime=-Infinity;
tuner.addEventListener('pointerdown',e=>{
 if(e.button!==0)return;e.preventDefault();tuner.focus();
 tuner.setPointerCapture(e.pointerId);tunerDrag={y:e.clientY,startY:e.clientY,moved:false};
});
tuner.addEventListener('pointermove',e=>{
 if(!tunerDrag)return;
 if(Math.abs(e.clientY-tunerDrag.startY)>5)tunerDrag.moved=true;
 const steps=Math.trunc((tunerDrag.y-e.clientY)/24);
 if(steps){setStation(stationIndex+steps);tunerDrag.y-=steps*24;}
});
tuner.addEventListener('pointerup',()=>{if(tunerDrag&&!tunerDrag.moved)setStation((stationIndex+1)%stations.length);tunerDrag=null;});
for(const event of ['pointercancel','lostpointercapture'])tuner.addEventListener(event,()=>{tunerDrag=null;});
tuner.addEventListener('wheel',e=>{
 e.preventDefault();const now=Date.now();if(now-wheelTime<180||Math.abs(e.deltaY)<1)return;
 wheelTime=now;setStation(stationIndex+Math.sign(e.deltaY));
},{passive:false});
tuner.addEventListener('keydown',e=>{
 let next=stationIndex;
 if(['ArrowUp','ArrowRight'].includes(e.key))next++;
 else if(['ArrowDown','ArrowLeft'].includes(e.key))next--;
 else if(e.key==='Home')next=0;
 else if(e.key==='End')next=stations.length-1;
 else if(e.key==='Enter'||e.key===' ')next=(stationIndex+1)%stations.length;
 else return;
 e.preventDefault();setStation(next);
});
updateStation();

const titleWindow=document.getElementById('title'),titleText=document.getElementById('title-text'),titleTrack=document.getElementById('title-track'),titleCopy=document.getElementById('title-copy');
const titleMotion=typeof window.matchMedia==='function'?window.matchMedia('(prefers-reduced-motion: reduce)'):null;
let titleAnimation=null,titleMeasureKey='';
function fitTitle(){
 const width=titleText.scrollWidth,available=titleWindow.clientWidth;
 const key=titleText.textContent+'|'+width+'|'+available+'|'+Boolean(titleMotion&&titleMotion.matches);
 if(key!==titleMeasureKey){
  titleMeasureKey=key;
  if(titleAnimation){titleAnimation.cancel();titleAnimation=null;}
  titleCopy.hidden=true;titleCopy.textContent=titleText.textContent;
  if(width>available+1&&!(titleMotion&&titleMotion.matches)&&typeof titleTrack.animate==='function'){
   titleCopy.hidden=false;
   const distance=width+32,total=distance/22;
   titleAnimation=titleTrack.animate([
    {transform:'translateX(0)',offset:0},
    {transform:'translateX(-'+distance+'px)',offset:1}
   ],{duration:total*1000,delay:2000,iterations:Infinity,easing:'steps('+Math.ceil(distance/3)+', end)'});
  }
 }
 if(titleAnimation){if(listening)titleAnimation.play();else titleAnimation.pause();}
}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fitTitle).observe(titleWindow);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitTitle);
if(titleMotion&&titleMotion.addEventListener)titleMotion.addEventListener('change',fitTitle);

// Fit the complete mobile radio between the safe-area edges and page links.
function fitMobile(){
 const scene=document.querySelector('.scene');
 if(!scene||!scene.offsetHeight)return;
 alignSpeaker();
 const height=window.visualViewport?window.visualViewport.height:window.innerHeight;
 const footer=document.querySelector('.page-links');
 const top=18,bottom=footer?Math.min(height-18,footer.getBoundingClientRect().top-20):height-18;
 const available=Math.max(1,bottom-top);
 const scale=Math.min(1,available/scene.offsetHeight);
 scene.style.setProperty('--mobile-scale',String(Math.max(.01,scale)));
 scene.style.setProperty('--scene-top',(top+available/2)+'px');
}
window.addEventListener('resize',fitMobile);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fitMobile);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitMobile);
requestAnimationFrame(fitMobile);
setInterval(tick,500);tick();

}
button.addEventListener('click',()=>{if(listening){stop();}else{startListening();}});

function tick(){updateSleep();const p=programme();display(p);if(listening&&!tuning&&!loading&&(p.index!==loaded||Math.abs(audio.currentTime-p.offset)>3||audio.ended))join();}
audio.addEventListener('waiting',()=>{if(listening)status.textContent='';});
audio.addEventListener('playing',()=>{if(listening&&!tuning){document.body.classList.add('playing');if(powerFadePending){powerFadePending=false;fadePower(1,350);}status.textContent='';}});
audio.addEventListener('error',()=>{if(listening&&!tuning&&!loading){loaded=-1;stop('Audio unavailable. Press Listen to try again.');}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
window.addEventListener('pageshow',tick);
if('mediaSession' in navigator){for(const action of ['seekbackward','seekforward','seekto','previoustrack','nexttrack']){try{navigator.mediaSession.setActionHandler(action,null);}catch{}}try{navigator.mediaSession.setActionHandler('pause',()=>stop());navigator.mediaSession.setActionHandler('play',()=>startListening());}catch{}}
document.addEventListener('pointerdown',()=>document.body.classList.remove('keyboard-controls'),true);
document.addEventListener('keydown',e=>{if(['Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End','PageUp','PageDown'].includes(e.key))document.body.classList.add('keyboard-controls');});
// Match the last grille row to the lower physical end of the sleep arc.
function alignSpeaker(){
 const speaker=document.querySelector('.speaker');
 const housing=document.querySelector('.radio'),screen=document.querySelector('.lcd');
 const factor=housing.offsetWidth ? housing.getBoundingClientRect().width/housing.offsetWidth : 1;
 const rect=element=>{const r=element.getBoundingClientRect();return Object.fromEntries(['left','top','right','bottom','width','height'].map(k=>[k,r[k]/factor]));};
 const caseBox=rect(housing),screenBox=rect(screen),controlBox=rect(dial);
 const centreX=controlBox.left+controlBox.width/2,centreY=controlBox.top+controlBox.height/2;
 housing.style.setProperty('--case-curve-x',Math.max(30,caseBox.right-centreX)+'px');
 housing.style.setProperty('--case-curve-y',Math.max(30,caseBox.bottom-centreY)+'px');
 const sideHeight=screenBox.height;
 // Size the hidden circle so its exposed chord spans the full display height.
 const sideProjection=window.innerWidth<=650?10:12;
 const sideDiameter=sideHeight*sideHeight/(4*sideProjection)+sideProjection;
 housing.style.setProperty('--side-dial-diameter',sideDiameter+'px');
 housing.style.setProperty('--side-dial-height',sideHeight+'px');
 housing.style.setProperty('--side-dial-top',(screenBox.top-caseBox.top+(screenBox.height-sideHeight)/2)+'px');
 housing.style.setProperty('--battery-width',rect(speaker).width+'px');
 if(window.innerWidth<=650){speaker.style.removeProperty('--speaker-height');return;}
 const grilleBox=rect(speaker),dialBox=rect(dial);
 const arcBottom=dialBox.top+dialBox.height*(.5+.43*Math.cos(25*Math.PI/180));
 speaker.style.setProperty('--speaker-height',Math.max(0,arcBottom-grilleBox.top)+'px');
}
if(typeof ResizeObserver!=='undefined'){
 const speakerObserver=new ResizeObserver(()=>requestAnimationFrame(alignSpeaker));
 speakerObserver.observe(document.querySelector('.panel'));
 window.addEventListener('resize',alignSpeaker);
 requestAnimationFrame(alignSpeaker);
}
const tuner=document.getElementById('station-tuner');
let tuning=false,tuneTimer=null,noiseContext=null,noiseSource=null,noiseGain=null;
function updateStation(){
 const station=stations[stationIndex];
 document.getElementById('station-name').textContent=station.name;
 document.getElementById('station-number').textContent=String(stationIndex+1).padStart(2,'0');
 tuner.setAttribute('aria-valuenow',String(stationIndex+1));
 tuner.setAttribute('aria-valuetext',station.name);
 tuner.style.setProperty('--station-angle',(stationIndex*9)+'deg');
}
function silenceTuningNoise(){
 if(noiseSource){try{noiseSource.stop();}catch{}noiseSource.disconnect();noiseSource=null;}
 if(noiseGain){noiseGain.disconnect();noiseGain=null;}
}
function cancelTuning(){clearTimeout(tuneTimer);tuneTimer=null;tuning=false;silenceTuningNoise();}
function prepareTuningAudio(){
 try{
  const AudioContext=window.AudioContext||window.webkitAudioContext;
  if(!AudioContext)return null;
  if(!noiseContext)noiseContext=new AudioContext();
  if(noiseContext.state==='suspended')noiseContext.resume().catch(()=>{});
  return noiseContext;
 }catch{return null;}
}
function playTuningNoise(){
 silenceTuningNoise();
 if(!listening||baseVolume===0||sleepGain===0)return;
 try{
  const context=prepareTuningAudio();if(!context)return;
  const length=Math.ceil(context.sampleRate*.24),buffer=context.createBuffer(1,length,context.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<length;i++)data[i]=(Math.random()*2-1);
  const source=context.createBufferSource(),filter=context.createBiquadFilter(),gain=context.createGain();
  source.buffer=buffer;filter.type='bandpass';filter.frequency.value=1200;filter.Q.value=.65;
  const now=context.currentTime,level=baseVolume*sleepGain*.12;
  gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(level,now+.015);
  gain.gain.linearRampToValueAtTime(level*.6,now+.1);gain.gain.linearRampToValueAtTime(0,now+.24);
  source.connect(filter);filter.connect(gain);gain.connect(context.destination);
  noiseSource=source;noiseGain=gain;
  source.onended=()=>{source.disconnect();filter.disconnect();gain.disconnect();if(noiseSource===source){noiseSource=null;noiseGain=null;}};
  source.start();source.stop(now+.245);
 }catch{silenceTuningNoise();}
}
function setStation(index){
 index=Math.max(0,Math.min(stations.length-1,index));
 if(index===stationIndex)return;
 cancelTuning();stationIndex=index;
 try{localStorage.setItem('cinema-radio-station',stations[index].id);}catch{}
 generation++;loading=false;loaded=-1;updateStation();display(programme());status.textContent='';
 if(!listening)return;
 cancelPowerFade();powerGain=0;powerFadePending=true;applyAudioLevel();audio.pause();
 document.body.classList.remove('playing');tuning=true;playTuningNoise();
 tuneTimer=setTimeout(()=>{tuneTimer=null;tuning=false;if(listening)join();},260);
}
// The narrow visible rim has a larger transparent pointer/touch target.
let tunerDrag=null,wheelTime=-Infinity;
tuner.addEventListener('pointerdown',e=>{
 if(e.button!==0)return;e.preventDefault();tuner.focus();
 tuner.setPointerCapture(e.pointerId);tunerDrag={y:e.clientY,startY:e.clientY,moved:false};
});
tuner.addEventListener('pointermove',e=>{
 if(!tunerDrag)return;
 if(Math.abs(e.clientY-tunerDrag.startY)>5)tunerDrag.moved=true;
 const steps=Math.trunc((tunerDrag.y-e.clientY)/24);
 if(steps){setStation(stationIndex+steps);tunerDrag.y-=steps*24;}
});
tuner.addEventListener('pointerup',()=>{if(tunerDrag&&!tunerDrag.moved)setStation((stationIndex+1)%stations.length);tunerDrag=null;});
for(const event of ['pointercancel','lostpointercapture'])tuner.addEventListener(event,()=>{tunerDrag=null;});
tuner.addEventListener('wheel',e=>{
 e.preventDefault();const now=Date.now();if(now-wheelTime<180||Math.abs(e.deltaY)<1)return;
 wheelTime=now;setStation(stationIndex+Math.sign(e.deltaY));
},{passive:false});
tuner.addEventListener('keydown',e=>{
 let next=stationIndex;
 if(['ArrowUp','ArrowRight'].includes(e.key))next++;
 else if(['ArrowDown','ArrowLeft'].includes(e.key))next--;
 else if(e.key==='Home')next=0;
 else if(e.key==='End')next=stations.length-1;
 else if(e.key==='Enter'||e.key===' ')next=(stationIndex+1)%stations.length;
 else return;
 e.preventDefault();setStation(next);
});
updateStation();

const titleWindow=document.getElementById('title'),titleText=document.getElementById('title-text'),titleTrack=document.getElementById('title-track'),titleCopy=document.getElementById('title-copy');
const titleMotion=typeof window.matchMedia==='function'?window.matchMedia('(prefers-reduced-motion: reduce)'):null;
let titleAnimation=null,titleMeasureKey='';
function fitTitle(){
 const width=titleText.scrollWidth,available=titleWindow.clientWidth;
 const key=titleText.textContent+'|'+width+'|'+available+'|'+Boolean(titleMotion&&titleMotion.matches);
 if(key!==titleMeasureKey){
  titleMeasureKey=key;
  if(titleAnimation){titleAnimation.cancel();titleAnimation=null;}
  titleCopy.hidden=true;titleCopy.textContent=titleText.textContent;
  if(width>available+1&&!(titleMotion&&titleMotion.matches)&&typeof titleTrack.animate==='function'){
   titleCopy.hidden=false;
   const distance=width+32,hold=2,total=hold+distance/22;
   titleAnimation=titleTrack.animate([
    {transform:'translateX(0)',offset:0},
    {transform:'translateX(0)',offset:hold/total},
    {transform:'translateX(-'+distance+'px)',offset:1}
   ],{duration:total*1000,iterations:Infinity,easing:'linear'});
  }
 }
 if(titleAnimation){if(listening)titleAnimation.play();else titleAnimation.pause();}
}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fitTitle).observe(titleWindow);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitTitle);
if(titleMotion&&titleMotion.addEventListener)titleMotion.addEventListener('change',fitTitle);

// Fit the complete mobile radio between the safe-area edges and page links.
function fitMobile(){
 const scene=document.querySelector('.scene');
 if(!scene||!scene.offsetHeight)return;
 const height=window.visualViewport?window.visualViewport.height:window.innerHeight;
 const footer=document.querySelector('.page-links');
 const reserved=(footer?footer.offsetHeight:35)+55;
 const scale=(window.innerWidth<=650||height<=500)?Math.min(1,(height-reserved)/scene.offsetHeight):1;
 scene.style.setProperty('--mobile-scale',String(Math.max(.1,scale)));
 alignSpeaker();
}
window.addEventListener('resize',fitMobile);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fitMobile);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitMobile);
requestAnimationFrame(fitMobile);
setInterval(tick,500);tick();
</script></body></html>
